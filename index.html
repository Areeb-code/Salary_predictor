<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salary Predictor</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7ff, #dfe9ff);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        padding: 32px;
        width: min(92vw, 460px);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 16px;
        color: #1f2937;
        font-size: 2rem;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #374151;
      }

      input {
        width: 100%;
        padding: 14px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 18px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .result {
        margin-top: 22px;
        padding: 16px;
        border-radius: 10px;
        background: #eff6ff;
        color: #1e3a8a;
        font-weight: 600;
        display: none;
      }

      .result.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Salary Predictor</h1>

      <label for="experience">Enter experience in months</label>
      <input id="experience" type="number" step="0.1" placeholder="Example: 12" />

      <button id="predictBtn">Predict Salary</button>

      <div id="result" class="result"></div>
    </div>

    <script>
      const predictBtn = document.getElementById('predictBtn');
      const experienceInput = document.getElementById('experience');
      const resultBox = document.getElementById('result');

      predictBtn.addEventListener('click', async () => {
        const months = experienceInput.value;

        if (!months || Number(months) < 0) {
          resultBox.textContent = 'Please enter a valid number of months.';
          resultBox.classList.add('visible');
          return;
        }

        resultBox.textContent = 'Predicting...';
        resultBox.classList.add('visible');

        try {
          const response = await fetch('/predict', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ experience_months: Number(months) })
          });

          if (!response.ok) {
            throw new Error('Prediction failed');
          }

          const data = await response.json();
          resultBox.textContent = `Predicted salary:$ ${data.ans.toFixed(2)} thousand`;
        } catch (error) {
          resultBox.textContent = 'There was a problem getting the prediction. Please try again.';
        }
      });
    </script>
  </body>
</html>
